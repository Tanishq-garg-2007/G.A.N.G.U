[project]
name = "agents"
version = "0.1.0"
description = "Agents using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.11, <3.14"
dependencies = [
    "assemblyai>=0.44.3",
    "beautifulsoup4>=4.12.0",
    "browser-use>=0.8.1",
    "cmake>=4.2.0",
    "crewai[tools]>=0.201.1,<1.0.0",
    "face-recognition>=1.3.0",
    "face-recognition-models",
    "fastapi>=0.123.9",
    "google-api-python-client>=2.187.0",
    "google-auth-httplib2>=0.2.1",
    "google-auth-oauthlib>=1.2.2",
    "google-generativeai>=0.8.5",
    "opencv-python>=4.12.0.88",
    "pillow>=11.3.0",
    "playwright>=1.40.0",
    "pydantic>=2.0.0",
    "pymongo>=4.15.5",
    "pyngrok>=7.5.0",
    "pytesseract>=0.3.13",
    "pytest>=7.4.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "scipy>=1.15.3",
    "setuptools>=80.9.0",
    "sounddevice>=0.5.2",
    "todoist-api-python>=3.1.0",
    "todoist-python>=8.1.4",
    "twilio>=9.8.8",
    "tzdata>=2025.2",
]

[project.scripts]
agents = "agents.main:run"
run_crew = "agents.main:run"
train = "agents.main:train"
replay = "agents.main:replay"
test = "agents.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"

[tool.uv.sources]
face-recognition-models = { git = "https://github.com/ageitgey/face_recognition_models" }
